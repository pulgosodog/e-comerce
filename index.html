<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo E-commerce Estático</title>
  <link rel="stylesheet" href="public/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="topbar">
      <a class="logo" href="#">
        <img src="public/images/uploads/1765362651081-6145c1d32e6ac8e63a46c912dc33c5bb.avif" alt="Demo Store" width="36" />
        <span>Demo Store</span>
      </a>
      <div class="search">
        <form class="search-form" id="search-form">
          <input id="search-input" type="search" placeholder="Buscar productos..." aria-label="Buscar productos" />
          <button type="submit" class="search-btn">
            <span class="search-btn-text">Buscar</span>
            <span class="search-btn-icon">🔍</span>
          </button>
        </form>
      </div>
      <div class="nav-actions">
        <div class="categories">
          <button id="categories-toggle" class="btn" type="button">Categorías</button>
          <div class="dropdown" id="category-list" aria-label="Categorías">
            <a href="#" data-category="">Todas</a>
            <a href="#" data-category="Electrónica">Electrónica</a>
            <a href="#" data-category="Hogar">Hogar</a>
            <a href="#" data-category="Moda">Moda</a>
          </div>
        </div>
        <a id="cart-link" href="#cart" class="icon" aria-label="Ver carrito">🛒 <span id="cart-count">0</span></a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" id="hero-carousel">
      <div class="carousel"></div>
      <button class="carousel-prev" aria-label="Anterior">‹</button>
      <button class="carousel-next" aria-label="Siguiente">›</button>
    </section>

    <section class="product-listing" id="products">
      <div class="controls">
        <div class="left">
          <h3 id="product-title">Productos Destacados</h3>
        </div>
        <div class="sort">
          <select id="sort-select">
            <option value="">Ordenar por:</option>
            <option value="price_asc">Precio: menor a mayor</option>
            <option value="price_desc">Precio: mayor a menor</option>
          </select>
        </div>
      </div>
      <div class="cards" id="product-cards"></div>
    </section>

    <section class="product-listing" id="cart">
      <div class="controls">
        <div class="left">
          <h3>Carrito Demo</h3>
        </div>
      </div>
      <div class="cards" id="cart-items">
        <p style="color:#666; padding:20px;">Agrega productos al carrito para ver la experiencia local.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">Demo estática sin servidor creada usando los assets del proyecto original.</div>
  </footer>

  <script src="public/js/carousel.js"></script>
  <script src="public/js/demo.js"></script>
</body>
</html>
